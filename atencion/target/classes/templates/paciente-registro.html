<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta de paciente</title>
</head>
<body>
<h1>Crear cuenta de paciente</h1>
<p th:if="${error}" th:text="${error}"></p>
<form action="/paciente/registro" method="post">
    <p><label for="nombre">Nombre completo</label><br><input type="text" id="nombre" name="nombre" required></p>
    <p><label for="usuario">Usuario</label><br><input type="text" id="usuario" name="usuario" required></p>
    <p><label for="clave">Clave</label><br><input type="password" id="clave" name="clave" required></p>
    <p><label for="telefono">Teléfono</label><br><input type="text" id="telefono" name="telefono"></p>
    <p><button type="submit">Crear cuenta</button></p>
</form>
<p><a href="/paciente/login">Ya tengo cuenta</a></p>
</body>
</html>
