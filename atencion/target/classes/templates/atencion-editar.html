<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar atención</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1>Editar atención médica</h1>
<form th:action="@{'/atencion/editar/' + ${atencion.idAtencion}}" method="post">
    <p><label>Número de atención</label><br><input type="text" th:value="${atencion.idAtencion}" readonly></p>
    <p><label>Paciente</label><br><input type="text" th:value="${atencion.paciente}" readonly></p>
    <p><label>Cita</label><br><input type="text" th:value="${atencion.idCita}" readonly></p>
    <p><label>Historia clínica</label><br><input type="text" th:value="${atencion.idHC}" readonly></p>
    <p><label for="estado">Estado</label><br><input type="text" id="estado" name="estado" th:value="${atencion.estado}"></p>
    <p><label for="diagnostico">Diagnóstico</label><br><input type="text" id="diagnostico" name="diagnostico" th:value="${atencion.diagnostico}" required></p>
    <p><label for="tratamiento">Tratamiento</label><br><input type="text" id="tratamiento" name="tratamiento" th:value="${atencion.tratamiento}" required></p>
    <p><label for="observaciones">Observaciones</label><br><input type="text" id="observaciones" name="observaciones" th:value="${atencion.observaciones}"></p>
    <p><a th:href="@{'/atencion/detalle/' + ${atencion.idAtencion}}">Cancelar</a> <button type="submit">Guardar cambios</button></p>
</form>
</body>
</html>
