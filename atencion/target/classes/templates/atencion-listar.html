<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Atenciones médicas</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1>Atenciones médicas</h1>
<p><a th:href="@{/atencion/nueva}">Registrar atención</a></p>
<p><a th:href="@{/api/atenciones}" target="_blank">Ver listado JSON</a></p>
<form th:action="@{/atencion/buscar}" method="get">
    <label for="filtro">Buscar</label>
    <input type="text" id="filtro" name="filtro">
    <button type="submit">Buscar</button>
</form>
<table>
    <thead><tr><th>Número</th><th>Fecha</th><th>Paciente</th><th>Cita</th><th>Historia</th><th>Diagnóstico</th><th>Receta</th><th>Análisis</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody>
    <tr th:each="a : ${atenciones}">
        <td th:text="${a.idAtencion}">AT-001</td>
        <td th:text="${#temporals.format(a.fecha, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
        <td th:text="${a.paciente}">Paciente</td>
        <td th:text="${a.idCita}">CIT-001</td>
        <td><a th:if="${a.idHC != null}" th:href="@{'/historias/' + ${a.idHC}}" th:text="${a.idHC}">HC-001</a><span th:if="${a.idHC == null}">-</span></td>
        <td th:text="${a.diagnostico}">Diagnóstico</td>
        <td th:text="${a.idReceta != null ? a.idReceta : 'Sin receta'}">Sin receta</td>
        <td th:text="${a.idAnalisis != null ? a.idAnalisis : 'Sin análisis'}">Sin análisis</td>
        <td th:text="${a.estado}">REGISTRADA</td>
        <td><a th:href="@{'/atencion/detalle/' + ${a.idAtencion}}">Ver</a> <a th:href="@{'/atencion/editar/' + ${a.idAtencion}}">Editar</a> <a th:href="@{'/api/atenciones/' + ${a.idAtencion} + '/completa'}" target="_blank">JSON</a></td>
    </tr>
    <tr th:if="${#lists.isEmpty(atenciones)}"><td colspan="10">No hay atenciones médicas registradas.</td></tr>
    </tbody>
</table>
</body>
</html>
