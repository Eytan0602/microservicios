server.port=8080
microservicio.internal-token=${MICROSERVICIOS_INTERNAL_TOKEN:clinica-local-internal-token}

spring.datasource.url=jdbc:h2:mem:clinicadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# URL de los demas microservicios
microservicio.validar.url=http://localhost:8081/validar
microservicio.cita.url=http://localhost:8082/citas
microservicio.historia.url=http://localhost:8083/historias
microservicio.catalogo.url=http://localhost:8084/catalogo
microservicio.receta.url=http://localhost:8085/recetas
microservicio.analisis.url=http://localhost:8086/analisis
